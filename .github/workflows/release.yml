name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the build to
        required: true

permissions:
  contents: write

jobs:
  device:
    runs-on: ubuntu-24.04-arm
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.22.3

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
          ALSA_LIB=/usr/lib/aarch64-linux-gnu/libasound.so.2 scripts/sysroot.sh
          scripts/build-device.sh

      - name: Package
        run: |
          mkdir -p dist/twinbit dist/Imgs
          cp target/aarch64-unknown-linux-gnu/release/twinbit dist/twinbit/
          cp assets/Twinbit.sh dist/
          cp assets/Twinbit.png dist/Imgs/
          tar -C dist -czf "twinbit-$TAG-aarch64-linux.tar.gz" .

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "twinbit-$TAG-aarch64-linux.tar.gz" --clobber
